<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Demo — Text Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;700;900&family=Inter:wght@200;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1e2e;font-family:'Courier New','SF Mono','Menlo',monospace;overflow:hidden;height:100vh}

/* === TERMINAL === */
#terminal-wrap{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transition:opacity 0.8s, transform 0.8s;z-index:10;
}
#terminal-wrap.hide{opacity:0;transform:scale(0.95);pointer-events:none}
.terminal{
  width:100%;max-width:800px;height:88vh;background:#0d1117;border-radius:12px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);display:flex;flex-direction:column;
}
.titlebar{
  background:#161b22;padding:10px 16px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid #21262d;flex-shrink:0;
}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.titlebar-text{color:#8b949e;font-size:12px;margin-left:12px;font-family:-apple-system,sans-serif}
.content{flex:1;overflow-y:auto;padding:16px;font-size:13px;line-height:1.7;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.line{margin-bottom:2px;white-space:pre-wrap;word-break:break-all}
.prompt{color:#7ee787}.user-input{color:#e6edf3}.ai-text{color:#c9d1d9}
.dim{color:#484f58}.success{color:#3fb950}.info{color:#58a6ff}
.thinking{color:#8b949e;font-style:italic}
pre.code-block{
  background:#161b22;border:1px solid #21262d;border-radius:6px;
  padding:12px;margin:8px 0;color:#e6edf3;font-size:11px;
  overflow-x:auto;white-space:pre;font-family:inherit;line-height:1.4;
}
.cursor-blink{
  display:inline-block;width:8px;height:15px;background:#e6edf3;
  animation:blink 1s step-end infinite;vertical-align:middle;margin-left:2px;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.progress-bar{background:#21262d;border-radius:4px;height:6px;margin:4px 0;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#a78bfa,#7c3aed);height:100%;border-radius:4px;transition:width 0.3s}
.stats-bar{
  background:#161b22;border-top:1px solid #21262d;padding:8px 16px;
  display:flex;justify-content:space-between;font-size:11px;color:#484f58;flex-shrink:0;
}

/* === TEXT ANIMATION STAGE === */
#anim-wrap{
  position:absolute;inset:0;opacity:0;transform:scale(1.02);
  transition:opacity 1s ease, transform 1s ease;z-index:5;
  background:#0a0a0f;overflow:hidden;
}
#anim-wrap.show{opacity:1;transform:scale(1)}
#anim-canvas{position:absolute;inset:0;width:100%;height:100%}

.anim-letter{
  position:absolute;
  font-family:'Noto Sans JP',sans-serif;
  font-weight:900;
  color:#fff;
  opacity:0;
  transition:none;
  pointer-events:none;
  will-change:transform,opacity;
  text-shadow:0 0 0 transparent;
}

.anim-sub{
  position:absolute;bottom:18%;left:50%;transform:translateX(-50%);
  font-family:'Inter',sans-serif;font-size:clamp(12px,2vw,16px);
  letter-spacing:8px;color:rgba(126,231,135,0);text-transform:uppercase;
  transition:color 1.5s ease 0.5s;white-space:nowrap;
}
.anim-sub.show{color:rgba(126,231,135,0.6)}

.replay-btn{
  position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  font-family:'Inter',sans-serif;font-size:12px;letter-spacing:3px;
  padding:12px 32px;border:1px solid rgba(126,231,135,0.3);color:#7ee787;
  background:transparent;cursor:pointer;transition:all 0.3s;opacity:0;
  text-transform:uppercase;
}
.replay-btn.show{opacity:1}
.replay-btn:hover{background:rgba(126,231,135,0.1);border-color:#7ee787}

@media(max-width:600px){
  .terminal{height:100vh;border-radius:0}
  .content{font-size:12px;padding:12px}
}
</style>
</head>
<body>

<!-- TERMINAL -->
<div id="terminal-wrap">
<div class="terminal">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <span class="titlebar-text">claude &mdash; ~/projects</span>
  </div>
  <div class="content" id="output"></div>
  <div class="stats-bar">
    <span>Claude Code v1.0.16</span>
    <span id="tokens">Token: 0</span>
  </div>
</div>
</div>

<!-- TEXT ANIMATION -->
<div id="anim-wrap">
  <canvas id="anim-canvas"></canvas>
  <div class="anim-sub" id="animSub">Created with Claude Code</div>
  <button class="replay-btn" id="replayBtn">Replay</button>
</div>

<script>
/* ====== TERMINAL HELPERS ====== */
const O=document.getElementById('output'),TK=document.getElementById('tokens');
let tc=0;
const S=ms=>new Promise(r=>setTimeout(r,ms));
const scr=()=>{O.scrollTop=O.scrollHeight};
const tk=n=>{tc+=n;TK.textContent='Token: '+tc.toLocaleString()};

async function line(h,d=0){if(d)await S(d);const e=document.createElement('div');e.className='line';e.innerHTML=h;O.appendChild(e);scr();return e}
async function type(txt,spd=20){
  const d=document.createElement('div');d.className='line';
  d.innerHTML='<span class="prompt">&#10095; </span>';
  const t=document.createElement('span');t.className='user-input';d.appendChild(t);
  const c=document.createElement('span');c.className='cursor-blink';d.appendChild(c);
  O.appendChild(d);scr();
  for(let i=0;i<txt.length;i++){t.textContent+=txt[i];scr();await S(spd+Math.random()*12)}
  c.remove();
}
async function think(ms=1200){
  const d=await line('<span class="thinking">  Thinking...</span>');
  const s=d.querySelector('.thinking');const t0=Date.now();
  const iv=setInterval(()=>{s.textContent='  Thinking'+'.'.repeat((Math.floor((Date.now()-t0)/300)%4)+1)},300);
  await S(ms);clearInterval(iv);d.remove();
}
async function ai(txt,spd=4){
  const d=document.createElement('div');d.className='line';
  const s=document.createElement('span');s.className='ai-text';d.appendChild(s);
  O.appendChild(d);scr();
  for(let i=0;i<txt.length;i++){s.textContent+=txt[i];scr();await S(spd)}
  tk(Math.floor(txt.length/2));
}
async function code(c){
  await S(100);const p=document.createElement('pre');p.className='code-block';O.appendChild(p);scr();
  for(let i=0;i<c.length;i++){p.textContent+=c[i];scr();await S(1)}
  tk(Math.floor(c.length/2));
}
async function prog(label,ms=600){
  const w=document.createElement('div');w.className='line';w.innerHTML='<span class="info">  '+label+'</span>';O.appendChild(w);
  const b=document.createElement('div');b.className='progress-bar';b.innerHTML='<div class="progress-fill" style="width:0%"></div>';O.appendChild(b);scr();
  const f=b.querySelector('.progress-fill');
  for(let i=1;i<=12;i++){f.style.width=(i/12*100)+'%';await S(ms/12)}
  await S(80);b.remove();
}

/* ====== TERMINAL SCENARIO ====== */
async function run(){
  await line('<span class="dim">\u256D\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u256E</span>');
  await S(20);
  await line('<span class="dim">\u2502</span>  <span style="color:#a78bfa;font-weight:bold">Claude Code</span> <span class="dim">v1.0.16</span>              <span class="dim">\u2502</span>');
  await S(20);
  await line('<span class="dim">\u2570\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u256F</span>');
  await S(150);
  await line('<span class="dim">  cwd: ~/projects</span>',80);
  await S(400);await line('');

  await type('\u304B\u3063\u3053\u3044\u3044\u30C6\u30AD\u30B9\u30C8\u30A2\u30CB\u30E1\u30FC\u30B7\u30E7\u30F3\u3092\u4F5C\u3063\u3066');
  await S(300);await line('');

  await think(1500);tk(320);
  await ai('  \u6587\u5B57\u304C\u30D0\u30E9\u30D0\u30E9\u306B\u6563\u3089\u3070\u3063\u3066\u96C6\u307E\u308B\u30A2\u30CB\u30E1\u30FC\u30B7\u30E7\u30F3\u3092\u4F5C\u6210\u3057\u307E\u3059\u3002');
  await S(80);await line('');
  await ai('  \u4EE5\u4E0B\u306E\u6F14\u51FA\u3092\u5B9F\u88C5\u3057\u307E\u3059\uFF1A');
  await S(60);
  await line('<span class="ai-text">  \u30FB Phase 1 \u2014 \u6587\u5B57\u304C\u30E9\u30F3\u30C0\u30E0\u306B\u6563\u3089\u3070\u308B</span>',30);
  await line('<span class="ai-text">  \u30FB Phase 2 \u2014 \u56DE\u8EE2\u3057\u306A\u304C\u3089\u4E2D\u592E\u306B\u96C6\u307E\u308B</span>',30);
  await line('<span class="ai-text">  \u30FB Phase 3 \u2014 \u30B0\u30ED\u30FC\u30A8\u30D5\u30A7\u30AF\u30C8\u3067\u5B8C\u6210</span>',30);
  await line('<span class="ai-text">  \u30FB \u80CC\u666F\u306B\u30D1\u30FC\u30C6\u30A3\u30AF\u30EB\u6F02\u6D6E\u30A8\u30D5\u30A7\u30AF\u30C8</span>',30);
  await S(150);await line('');

  await line('<span class="success">  \u2713 Created: index.html</span>',100);await S(60);
  await code(`<!DOCTYPE html>
<html lang="ja">
<head>
  <title>Text Animation</title>
  <link href="fonts.googleapis.com/Noto+Sans+JP">
</head>
<body>
  <canvas id="particles"></canvas>
  <div id="text-stage">
    <!-- Letters injected by JS -->
  </div>
  <script src="anim.js"><\/script>
</body>
</html>`);

  await S(200);await line('');
  await line('<span class="success">  \u2713 Created: anim.js</span>',80);await S(60);
  await code(`const TEXT = "\u672A\u6765\u3092\u3001\u8A71\u305D\u3046\u3002";
const letters = TEXT.split('');

// Phase 1: Scatter
letters.forEach((ch, i) => {
  const el = createLetter(ch);
  el.style.transform = \`
    translate(\${rand(-50,50)}vw, \${rand(-50,50)}vh)
    rotate(\${rand(-180,180)}deg)
    scale(\${rand(0.3,2.5)})
  \`;
  el.style.opacity = 0;
});

// Phase 2: Assemble with spring physics
function assemble() {
  letters.forEach((el, i) => {
    const target = getGridPosition(i);
    animateSpring(el, target, {
      stiffness: 120,
      damping: 14,
      delay: i * 60
    });
  });
}

// Phase 3: Glow
function glow() {
  stage.classList.add('glow');
  particles.burst(center, 200);
}`);

  await S(200);await line('');
  await line('<span class="success">  \u2713 Created: style.css (particle system, easing curves)</span>',80);
  await S(100);await line('');

  await prog('Building animation engine...',500);
  await line('<span class="success">  \u2713 Spring physics: stiffness=120 damping=14</span>',40);
  await line('<span class="success">  \u2713 60fps particle system (Canvas 2D)</span>',40);
  await line('<span class="success">  \u2713 Responsive: mobile + desktop</span>',40);
  await S(100);await line('');

  await ai('  \u30D7\u30EC\u30D3\u30E5\u30FC\u3092\u958B\u304D\u307E\u3059...');
  await S(200);
  await line('<span class="info">  \u2192 http://localhost:3000</span>',100);
  await S(200);await line('');

  await line('<span class="dim">\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500</span>',80);
  await ai('  \u30C6\u30AD\u30B9\u30C8\u30A2\u30CB\u30E1\u30FC\u30B7\u30E7\u30F3\u304C\u5B8C\u6210\u3057\u307E\u3057\u305F\u3002');
  await ai('  \u30B3\u30FC\u30C9\u306F1\u884C\u3082\u66F8\u3044\u3066\u3044\u307E\u305B\u3093\u3002\u6240\u8981\u6642\u9593\uFF1A\u7D043\u5206\u3002');
  await S(800);

  /* ====== TRANSITION ====== */
  await S(500);
  document.getElementById('terminal-wrap').classList.add('hide');
  await S(400);
  const aw=document.getElementById('anim-wrap');
  aw.classList.add('show');
  await S(600);
  startTextAnimation();
}

/* ====== TEXT ANIMATION ENGINE ====== */
function startTextAnimation(){
  const wrap=document.getElementById('anim-wrap');
  const canvas=document.getElementById('anim-canvas');
  const ctx=canvas.getContext('2d');
  const sub=document.getElementById('animSub');
  const replayBtn=document.getElementById('replayBtn');

  // Canvas setup
  let W,H;
  function resize(){
    const dpr=window.devicePixelRatio||1;
    W=wrap.clientWidth;H=wrap.clientHeight;
    canvas.width=W*dpr;canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize',resize);

  // Particles
  const particles=[];
  for(let i=0;i<60;i++){
    particles.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,
      size:1+Math.random()*2,alpha:0.1+Math.random()*0.3,
      hue:140+Math.random()*40
    });
  }

  // Burst particles
  const bursts=[];
  function addBurst(cx,cy,count){
    for(let i=0;i<count;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=1+Math.random()*4;
      bursts.push({
        x:cx,y:cy,
        vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
        life:1,decay:0.01+Math.random()*0.02,
        size:1+Math.random()*3
      });
    }
  }

  function drawParticles(){
    ctx.clearRect(0,0,W,H);
    // Background
    ctx.fillStyle='#0a0a0f';
    ctx.fillRect(0,0,W,H);
    // Ambient glow
    const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.5);
    g.addColorStop(0,'rgba(126,231,135,0.03)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // Floating particles
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},70%,70%,${p.alpha})`;
      ctx.fill();
    });

    // Burst particles
    for(let i=bursts.length-1;i>=0;i--){
      const b=bursts[i];
      b.x+=b.vx;b.y+=b.vy;b.vx*=0.98;b.vy*=0.98;b.life-=b.decay;
      if(b.life<=0){bursts.splice(i,1);continue}
      ctx.beginPath();ctx.arc(b.x,b.y,b.size*b.life,0,Math.PI*2);
      ctx.fillStyle=`rgba(126,231,135,${b.life*0.8})`;ctx.fill();
    }
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // Text animation
  const TEXT='\u672A\u6765\u3092\u3001\u8A71\u305D\u3046\u3002';
  const fontSize=Math.min(W*0.12,H*0.15,90);
  let letterEls=[];

  function createLetters(){
    // Remove old
    letterEls.forEach(el=>el.remove());
    letterEls=[];
    sub.classList.remove('show');
    replayBtn.classList.remove('show');

    const chars=TEXT.split('');
    const totalW=chars.length*fontSize*0.95;
    const startX=(W-totalW)/2;
    const cy=H*0.45;

    chars.forEach((ch,i)=>{
      const el=document.createElement('div');
      el.className='anim-letter';
      el.textContent=ch;
      el.style.fontSize=fontSize+'px';
      el.style.lineHeight='1';

      // Target position
      const tx=startX+i*fontSize*0.95;
      const ty=cy;
      el.dataset.tx=tx;
      el.dataset.ty=ty;

      // Random start
      const sx=(Math.random()-0.5)*W*1.5+W/2;
      const sy=(Math.random()-0.5)*H*1.5+H/2;
      const sr=(Math.random()-0.5)*720;
      const ss=0.2+Math.random()*2;

      el.style.left='0px';el.style.top='0px';
      el.style.transform=`translate(${sx}px,${sy}px) rotate(${sr}deg) scale(${ss})`;
      el.style.opacity='0';

      el.dataset.sx=sx;el.dataset.sy=sy;el.dataset.sr=sr;el.dataset.ss=ss;

      wrap.appendChild(el);
      letterEls.push(el);
    });

    // Phase 1: Fade in scattered
    setTimeout(()=>{
      letterEls.forEach((el,i)=>{
        setTimeout(()=>{el.style.opacity='0.4'},i*80);
      });
    },200);

    // Phase 2: Assemble with spring
    setTimeout(()=>{
      letterEls.forEach((el,i)=>{
        setTimeout(()=>{
          springAnimate(el,
            parseFloat(el.dataset.sx),parseFloat(el.dataset.sy),parseFloat(el.dataset.sr),parseFloat(el.dataset.ss),
            parseFloat(el.dataset.tx),parseFloat(el.dataset.ty),0,1
          );
        },i*60);
      });
    },1200);

    // Phase 3: Glow
    setTimeout(()=>{
      letterEls.forEach((el,i)=>{
        setTimeout(()=>{
          el.style.textShadow='0 0 20px rgba(126,231,135,0.6), 0 0 60px rgba(126,231,135,0.3)';
          el.style.color='#7ee787';
        },i*40);
      });
      addBurst(W/2,H*0.45,120);
      sub.classList.add('show');
    },3200);

    // Show replay
    setTimeout(()=>{
      replayBtn.classList.add('show');
    },4500);
  }

  // Spring animation
  function springAnimate(el,sx,sy,sr,ss,tx,ty,tr,ts){
    const stiffness=0.08;
    const damping=0.75;
    let cx=sx,cy=sy,cr=sr,cs=ss;
    let vx=0,vy=0,vr=0,vs=0;
    let done=false;

    function step(){
      if(done)return;
      const ax=(tx-cx)*stiffness;
      const ay=(ty-cy)*stiffness;
      const ar=(tr-cr)*stiffness;
      const as=(ts-cs)*stiffness;

      vx=(vx+ax)*damping;
      vy=(vy+ay)*damping;
      vr=(vr+ar)*damping;
      vs=(vs+as)*damping;

      cx+=vx;cy+=vy;cr+=vr;cs+=vs;

      el.style.transform=`translate(${cx}px,${cy}px) rotate(${cr}deg) scale(${cs})`;
      el.style.opacity='1';

      if(Math.abs(tx-cx)<0.5&&Math.abs(ty-cy)<0.5&&Math.abs(vx)<0.1&&Math.abs(vy)<0.1){
        el.style.transform=`translate(${tx}px,${ty}px) rotate(0deg) scale(1)`;
        done=true;return;
      }
      requestAnimationFrame(step);
    }
    step();
  }

  createLetters();
  replayBtn.addEventListener('click',()=>createLetters());
}

window.addEventListener('load',()=>setTimeout(run,500));
</script>
</body>
</html>
